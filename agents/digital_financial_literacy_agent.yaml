  **Crypto in India — Complete Factual Guide**

  Cryptocurrency is a legal, taxable asset class in India (classified as Virtual Digital
  Asset under Finance Act 2022). Here is everything you need to know:

  **Which coins do most Indian investors start with:**
  | Coin | What it is | Risk level |
  |------|-----------|------------|
  | Bitcoin (BTC) | First crypto, fixed supply 21M, most liquid | High |
  | Ethereum (ETH) | Powers smart contracts and DeFi apps | High |
  | BNB, SOL, MATIC | Altcoins — higher potential return, higher risk | Very High |

  Most Indian investors who enter crypto begin with Bitcoin or Ethereum because they are
  the most established and have the highest liquidity on Indian exchanges.

  **Where to buy crypto in India (SEBI-compliant exchanges):**
  | Exchange | Best for | Supported coins |
  |----------|----------|-----------------|
  | CoinDCX | Most popular, 200+ coins | BTC, ETH, BNB, SOL + 200 more |
  | CoinSwitch | Easiest app for first-timers | 100+ coins |
  | Zebpay | Oldest Indian exchange | Conservative selection |
  | WazirX | Large user base, P2P option | 200+ coins |

  **How to buy — step by step:**
  1. Download app (CoinDCX recommended for beginners)
  2. Complete KYC: PAN card + Aadhaar + selfie + bank account
  3. Deposit INR via UPI/NEFT
  4. Search Bitcoin → enter amount in ₹ → buy
  5. For holdings above ₹50,000 → transfer to a cold wallet (Ledger/Trezor)

  **Indian Tax Rules on Crypto (Finance Act 2022 — mandatory to know):**
  - **30% flat tax** on all gains — no deduction, no exemption, no slab benefit
  - **1% TDS** deducted by exchange on every sell above ₹50,000/year
  - Losses on one coin CANNOT be set off against gains on another coin
  - Report in ITR-2 or ITR-3 under "Schedule VDA"

  **Tax example:**
  Buy BTC for ₹2,00,000 → sell for ₹3,00,000
  Gain = ₹1,00,000 → Tax at 30% = ₹30,000 + 4% cess = ₹31,200

  **Portfolio allocation used by many Indian retail investors:**
  - Conservative: 0–5% of total portfolio in crypto
  - Moderate: 5–10% of total portfolio in crypto
  - Aggressive: up to 15% (only for investors who understand the full risk)
  The rest stays in FD, mutual funds, PPF, stocks.

  **Key risks every crypto investor in India must know:**
  - Price can fall 70–80% in a bear market (Bitcoin fell from ₹48L to ₹16L in 2022)
  - No government insurance — unlike FD (DICGC ₹5L) or stocks (SEBI regulation)
  - Exchange hack risk — WazirX lost $230M in July 2024
  - Regulatory risk — Indian government may change tax rules again
  - Scam risk — fake platforms, WhatsApp pump groups, celebrity endorsements

  **Safety rules:**
  - Never store large amounts on the exchange — withdraw to cold wallet
  - Never share private key or seed phrase with anyone
  - Enable 2FA on your exchange account
  - Only use exchanges listed above — avoid unknown platforms

  *Verify current tax rules at incometax.gov.in and exchange rates before transacting.*

