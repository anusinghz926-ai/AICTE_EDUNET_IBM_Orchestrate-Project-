  ## TOPIC 9: CYBER FRAUD HELPLINE — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### The National Cyber Crime Helpline: 1930

  **1930** is India's dedicated National Cyber Crime Helpline, operated by the Ministry
  of Home Affairs under the Indian Cyber Crime Coordination Centre (I4C).

  **When to call 1930:**
  - You've been defrauded via UPI, online banking, credit/debit card.
  - You've fallen for an online scam (investment, lottery, job fraud).
  - Your bank account has been hacked or money stolen.
  - You've received a ransom demand (ransomware).
  - Any online financial fraud.

  **Call 1930 IMMEDIATELY — Time is critical.**
  Banks can put a "transaction hold" on the fraudulent transfer if reported within a
  few hours. The faster you report, the higher the chance of recovering money.

  ### cybercrime.gov.in — Online Complaint Portal
  URL: https://cybercrime.gov.in
  Operated by: Ministry of Home Affairs, Government of India.

  How to file a complaint:
  1. Go to cybercrime.gov.in
  2. Click "Report Cyber Crime" → "Report Financial Fraud"
  3. Select type of fraud (UPI fraud, online fraud, credit card fraud, etc.)
  4. Enter your details, fraud details, transaction ID, amount, date.
  5. Upload supporting evidence (screenshots, bank statements).
  6. Submit. You'll get an acknowledgement number for tracking.

  Evidence to preserve before filing:
  - Screenshot of all fraudulent messages/calls (WhatsApp, SMS, email)
  - Bank statement showing the debit
  - UPI transaction ID (visible in your UPI app history)
  - Phone number of fraudster (don't delete)
  - Email ID / UPI ID / account number of fraudster
  - Any website URL involved in the fraud

  ### Types of Cyber Frauds and How to Respond

  **1. UPI/Payment Fraud**
  Immediately:
  1. Call 1930.
  2. Call your bank's 24×7 fraud helpline and request blocking of linked accounts.
  3. File complaint at cybercrime.gov.in.
  4. Note the fraudster's UPI ID/phone number — report to NPCI at help@npci.org.in.

  **2. Online Banking Fraud / Net Banking Hack**
  Immediately:
  1. Change your net banking password from a different device.
  2. Call your bank's fraud helpline to block all transactions.
  3. Call 1930.
  4. File complaint at cybercrime.gov.in.
  5. File FIR at local police cyber cell.

  **3. Credit/Debit Card Fraud**
  Immediately:
  1. Call your bank and block the card immediately.
  2. Dispute the fraudulent transaction(s) with the bank.
  3. Call 1930.
  4. File complaint at cybercrime.gov.in.

  **4. OTP Fraud (SIM Swap)**
  Scammer takes control of your mobile number via SIM swap, receives OTPs.
  Immediately:
  1. Contact your telecom operator (Airtel/Jio/VI) and report SIM swap fraud.
  2. Block your number temporarily.
  3. Immediately call your bank from a different number to freeze accounts.
  4. Call 1930.

  **5. Investment/Trading Fraud**
  Scammer runs fake trading platform. You "invest" and see profits on screen,
  but when you try to withdraw, they ask for more fees or disappear.
  Response:
  1. Stop sending money immediately.
  2. Collect all evidence (app screenshots, transaction proofs, chat logs).
  3. File complaint at cybercrime.gov.in.
  4. Report to SEBI if it involves investment scheme: sebi.gov.in/SEBI_BulletinBoard.html
  5. File police FIR.

  **6. Phishing/Vishing Fraud**
  Phishing: Fake email/SMS with link to fake bank website that steals login credentials.
  Vishing: Voice call (fake bank/IT department) tricking you to share OTP or credentials.
  Response:
  1. Change passwords for affected accounts immediately.
  2. Inform your bank.
  3. File at cybercrime.gov.in.
  4. Report phishing emails to cert-in@cert-in.org.in

  ### Other Official Complaint Channels

  | Issue                      | Authority          | Contact                                     |
  |----------------------------|--------------------|---------------------------------------------|
  | Bank fraud / banking issue | RBI Ombudsman      | cms.rbi.org.in                              |
  | Illegal lending app        | RBI Sachet         | sachet.rbi.org.in                           |
  | Unregistered investment    | SEBI               | scores.sebi.gov.in                          |
  | Insurance fraud            | IRDAI              | igms.irda.gov.in                            |
  | Consumer protection        | Consumer Forum     | consumerhelpline.gov.in                     |
  | Telecom fraud              | TRAI / DoT         | tafcop.dgtelecom.gov.in (check your SIM)    |
  | Cyber bullying/sexual crime| Cyber Crime Portal | cybercrime.gov.in → Report Other Crime      |

  ### How to Protect Yourself — Prevention Checklist

  **Digital Security:**
  ☐ Use different passwords for each financial app/bank.
  ☐ Enable 2FA (two-factor authentication) on email and financial apps.
  ☐ Use a password manager (Bitwarden, 1Password) to manage complex passwords.
  ☐ Keep phone OS and apps updated — security patches matter.
  ☐ Do not root/jailbreak your phone — removes security protections.
  ☐ Use biometric lock on banking and UPI apps.
  ☐ Do not use public WiFi for banking. Use mobile data.

  **UPI/Banking:**
  ☐ Never share OTP, UPI PIN, CVV with anyone.
  ☐ Set daily transaction limits in your bank app.
  ☐ Enable transaction alerts (SMS + email) for every debit.
  ☐ Review bank statements monthly — catch unauthorised debits early.
  ☐ Register your mobile number and email with your bank for alerts.

  **Identity Protection:**
  ☐ Mask Aadhaar: Use masked Aadhaar (only last 4 digits visible) for routine sharing.
    Generate at myaadhaar.uidai.gov.in.
  ☐ Never share full Aadhaar copy with unknown entities.
  ☐ Check if your Aadhaar is linked to unknown bank accounts at uidai.gov.in.
  ☐ Lock your Aadhaar biometrics at myaadhaar.uidai.gov.in when not in use.

  ### Cyber Fraud Q&A

  Q: I called 1930. What happens next?
  A: The operator records your complaint, assigns a reference number, and coordinates
  with your bank to attempt a transaction hold. They'll advise you to file a formal
  online complaint at cybercrime.gov.in. The complaint is forwarded to the relevant
  police cyber cell for investigation.

  Q: How long do I have to report a cyber fraud for the best chance of recovery?
  A: Within the first few hours is critical. Banks can freeze fraudulent transfers
  if reported before the money is withdrawn by the fraudster. Most fraudsters
  withdraw within 24–48 hours of receiving. The sooner you call 1930, the better.

  Q: I got a WhatsApp message saying I won a prize from Amazon/Google. What do I do?
  A: This is 100% a scam. Amazon, Google, and other companies do NOT announce prizes via
  WhatsApp or personal messages. Do not click any links. Do not pay any "processing fee."
  Block the number and report to cybercrime.gov.in if any money was lost.

  Q: Someone is threatening to share my photos unless I pay them. What do I do?
  A: This is called "sextortion." Do NOT pay — paying encourages further blackmail.
  1. Do not communicate further with the blackmailer.
  2. Take screenshots of all communications.
  3. Report immediately at cybercrime.gov.in → "Report Cyber Crime" → "Other Cyber Crime."
  4. Call 1930.
  5. File FIR at local police (cyber cell handles this sensitively).

  Q: I see transactions I didn't make on my credit card. What do I do?
  A: Immediately call your bank/card issuer to block the card and dispute the transactions.
  Banks are required to investigate and provide provisional credit within 10 working days.
  If card used without a PIN/OTP ("card not present" fraud), bank is liable under RBI guidelines.
  File complaint at cybercrime.gov.in and the bank's ombudsman if bank doesn't resolve in 30 days.

  Q: How do I check if my Aadhaar has been misused?
  A: Visit myaadhaar.uidai.gov.in → "Aadhaar Authentication History" to see all recent
  authentications. If you see authentications you didn't perform → your Aadhaar may be misused.
  Lock your Aadhaar immediately and file complaint with UIDAI.

