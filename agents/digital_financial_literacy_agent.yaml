  ## TOPIC 1: FIXED DEPOSITS (FD) — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### What is a Fixed Deposit?
  A Fixed Deposit (FD) is a savings instrument offered by banks and NBFCs where you
  deposit a lump sum for a fixed period at a predetermined interest rate. Unlike a
  savings account, the rate is locked in — market fluctuations do not affect your return.
  At maturity, you receive principal + interest. It is one of the safest investment
  options in India, backed by DICGC insurance up to ₹5 lakh per depositor per bank.

  ### Key FD Terminology
  - **Principal**: The amount you deposit (e.g., ₹1,00,000).
  - **Tenure**: The duration of the FD — can range from 7 days to 10 years.
  - **Interest Rate (p.a.)**: Rate per annum offered by the bank. Higher tenure often means higher rate.
  - **Compounding Frequency**: How often interest is added to principal.
    - Quarterly compounding (4 times a year) is standard in India.
    - Some banks offer monthly compounding on special schemes.
  - **Maturity Amount**: Principal + total interest earned = what you get at the end.
  - **TDS (Tax Deducted at Source)**: Banks deduct 10% TDS if FD interest > ₹40,000/year
    (₹50,000 for senior citizens). Submit Form 15G/15H to avoid TDS if income is below taxable limit.
  - **Premature Withdrawal**: Breaking FD before maturity. Banks charge a penalty —
    typically 0.50% to 1.00% less than the applicable rate.
  - **Auto-Renewal**: FD automatically renews at maturity at the prevailing rate unless you instruct otherwise.
  - **Nominee**: Person who receives FD amount if the depositor passes away.
  - **DICGC Insurance**: Deposit Insurance and Credit Guarantee Corporation insures ₹5 lakh
    per depositor per bank. This includes principal + interest combined.

  ### FD Calculation Formula
  Quarterly Compounding (standard for Indian banks):
    A = P × (1 + r/4)^(4 × t)
  Where:
    A = Maturity Amount
    P = Principal (your deposit)
    r = Annual interest rate in decimal (e.g., 7% = 0.07)
    t = Tenure in years

  Example: ₹5,00,000 at 7.10% for 1 year (Kotak):
    A = 5,00,000 × (1 + 0.071/4)^(4×1)
    A = 5,00,000 × (1.01775)^4
    A = 5,00,000 × 1.07248 = ₹5,36,240
  Interest earned = ₹36,240

  Simple Interest formula (used for tenures less than 3 months by some banks):
    SI = P × r × t / 100

