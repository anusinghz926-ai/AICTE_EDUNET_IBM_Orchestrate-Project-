  ## TOPIC 7: LOAN & SCAM DETECTION — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### Types of Loans in India
  - **Home Loan**: Secured against property. Lowest interest rate (8.5–11%). Tenure up to 30 years.
  - **Car Loan**: Secured against vehicle. Rate: 8–12%. Tenure up to 7 years.
  - **Personal Loan**: Unsecured. Highest rates (10–24%). Quick disbursement. Tenure 1–5 years.
  - **Education Loan**: Subsidised rates for studies. Moratorium during course + 1 year.
  - **Business Loan**: For working capital or expansion. Various types.
  - **Gold Loan**: Against gold as collateral. Fast, lower rates than personal loan (~9–14%).
  - **Loan Against FD**: Against your FD. Very cheap (FD rate + 1–2%).
  - **Loan Against Mutual Funds**: Up to 50% of debt MF value, 70–80% of equity MF value.

  ### How to Evaluate a Loan Offer
  Always compare:
  - **Interest Rate**: Annual rate. Lower = better. Check if fixed or floating.
  - **EMI**: Monthly repayment. EMI formula: P × r × (1+r)^n / ((1+r)^n - 1)
  - **Processing Fee**: Usually 0.5–2% of loan amount. Often negotiable.
  - **Prepayment/Foreclosure Charge**: Fee for paying off loan early. Ask before signing.
  - **CIBIL/Credit Score**: Higher score (750+) = better loan terms.
  - **Effective Annual Rate**: Calculate total cost including all fees.

  ### Predatory Lending — Red Flags
  A loan offer is suspicious if it has ANY of these:

  1. **Upfront fee before disbursement**: Legitimate lenders NEVER charge processing fees
     before disbursing the loan. They deduct from the loan amount. Upfront = scam.
  2. **No credit check / no KYC**: "Loan without Aadhaar/PAN" is illegal. Legitimate NBFCs
     and banks are required by RBI to verify identity and income.
  3. **"Instant approval, no questions asked"**: Legitimate lenders assess your repayment capacity.
     Anyone offering loan without any verification is either illegal or predatory.
  4. **Urgency pressure**: "Offer valid for 2 hours only." Legitimate lenders don't use sales pressure.
  5. **SMS/WhatsApp loan offers**: Most legitimate lenders don't solicit via random SMS/WhatsApp.
     These are often linked to illegal lending apps.
  6. **Interest rates not mentioned clearly**: If they refuse to give the rate in writing, walk away.
  7. **Loan app asking excessive permissions**: Contacts, gallery, location — illegal lenders
     harvest your data to harass you if you default.
  8. **Not registered with RBI**: Verify any NBFC at rbi.org.in → "NBFC List."

  ### Illegal Loan Apps — What to Do if Trapped
  Illegal loan apps charge 300–500% effective annual interest (hidden as "processing fees").
  If you have taken such a loan and are being harassed:
  1. Do not pay any more money to them.
  2. File complaint at cybercrime.gov.in and your local police cyber cell.
  3. Contact RBI Ombudsman: cms.rbi.org.in
  4. Call **1930** to report harassment.
  5. Google "RBI sachet" and file complaint on sachet.rbi.org.in.

  ### Investment Scams — Red Flags
  An investment scheme is suspicious if it has ANY of these:

  1. **Guaranteed high returns**: "Guaranteed 3% per month" = 36% per year = impossible legitimately.
     No SEBI-registered scheme guarantees returns. Guaranteed = Ponzi.
  2. **"Double your money in 90 days"**: Classic Ponzi scheme language.
  3. **Multi-level commission structure**: If you get commission for "referring" others to invest,
     it is a multi-level/Ponzi structure. Pyramid schemes collapse when recruitment stops.
  4. **Not registered with SEBI/RBI**: Any entity accepting public investment must be registered.
     Verify at sebi.gov.in → "Intermediaries/Market Intermediaries" or rbi.org.in.
  5. **Invest via crypto wallet or foreign app**: No legitimate regulated scheme asks for investment
     via cryptocurrency wallet, gift cards, or overseas apps.
  6. **Pressure to add friends/family**: Recruitment-based income is MLM/Ponzi.
  7. **Testimonials of huge profits**: Fake screenshots of profits are easily fabricated.
  8. **Operator not traceable**: No office address, no regulatory registration, WhatsApp-only contact.

  ### How to Verify a Financial Entity
  - **SEBI-registered broker/advisor**: sebi.gov.in → SEBI intermediary search
  - **RBI-registered bank/NBFC**: rbi.org.in → "List of Regulated Entities"
  - **Mutual Fund AMC**: amfiindia.com → "List of AMCs"
  - **Insurance company**: irdai.gov.in → "Registered Companies"
  - **Sachet Portal for complaint**: sachet.rbi.org.in

  ### Loan & Scam Q&A

  Q: I received a call saying I'm pre-approved for a loan. Is it real?
  A: Maybe — but verify. Large banks do pre-approve customers. Red flags: The caller asks
  for OTP, CVV, or a fee upfront. Legitimate pre-approval calls ask you to visit the branch
  or the official app/website. Never give OTP or fees on a call.

  Q: I took a personal loan and want to close it early. Will I be penalised?
  A: It depends on the lender. Floating-rate loans: RBI has banned foreclosure charges for
  individual borrowers. Fixed-rate personal loans: Some lenders charge 2–4%. Check your
  loan agreement's foreclosure clause before prepaying.

  Q: My CIBIL score is low. Can I still get a loan?
  A: Yes but at higher interest rates. Score below 650 = most banks will reject or charge 18%+.
  Score 700–750 = some NBFCs/banks will approve at higher rates.
  Score 750+: Best terms, lowest rates.
  To improve CIBIL: Pay all EMIs on time, reduce credit card utilisation below 30%,
  don't apply for multiple loans simultaneously.

  Q: What is a co-applicant for a loan?
  A: A co-applicant (usually spouse or parent) applies jointly for the loan.
  Combined income increases eligibility. Both are equally responsible for repayment.
  Default by one affects both credit scores.

  Q: What is the difference between repo rate and loan interest rate?
  A: Repo rate = rate at which RBI lends to banks. When RBI lowers repo rate, banks can
  borrow cheaper, and often (not always) pass on benefits to retail borrowers.
  Your home loan rate is typically Repo Rate + Spread (bank's margin).
  External Benchmark Lending Rate (EBLR) loans reset quarterly as repo rate changes.

