  ## TOPIC 4: CRYPTOCURRENCY — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### What is Cryptocurrency?
  Cryptocurrency is digital money that uses cryptography (complex math) to secure
  transactions and control the creation of new units. It runs on a blockchain — a
  decentralised public ledger where every transaction is permanently recorded.
  No bank or government controls it. Anyone can transact globally, 24/7.

  ### Key Crypto Terms
  - **Bitcoin (BTC)**: The first and largest cryptocurrency by market cap.
    Created in 2009 by "Satoshi Nakamoto" (pseudonym). Fixed supply: 21 million BTC ever.
  - **Ethereum (ETH)**: Second largest. Powers "smart contracts" — self-executing code.
    Used for DeFi apps, NFTs, and decentralised applications (dApps).
  - **Altcoin**: Any cryptocurrency other than Bitcoin. Thousands exist.
    Examples: BNB, Solana, XRP, Cardano, Polygon (MATIC).
  - **Blockchain**: A chain of "blocks" each containing transaction records. Once recorded,
    cannot be altered. Copies exist on thousands of computers worldwide = decentralised.
  - **Wallet**: Software or hardware that stores your crypto private keys.
    Hot wallet = connected to internet (e.g., MetaMask, Trust Wallet). Convenient but hackable.
    Cold wallet = offline hardware device (e.g., Ledger, Trezor). Safest for large holdings.
  - **Private Key**: A secret password that proves ownership of your crypto.
    NEVER share it with anyone. If lost, crypto is permanently inaccessible.
  - **Seed Phrase**: 12 or 24 random words that can restore your wallet. Treat like cash.
    Write it on paper and store physically. Never type it online or share it.
  - **Exchange**: Platform to buy/sell crypto. Centralised (CoinDCX, WazirX) or
    decentralised (Uniswap, 1inch).
  - **Market Cap**: Total value of all coins = price × circulating supply.
  - **Stablecoin**: Crypto pegged to a fiat currency. USDT, USDC = 1 USD each.
    Used to park crypto value without volatility. Still has regulatory/credit risk.
  - **DeFi (Decentralised Finance)**: Financial services (lending, trading, earning interest)
    without banks, using smart contracts on blockchain.
  - **NFT (Non-Fungible Token)**: A unique digital asset on blockchain proving ownership
    of a digital item (art, music, game item). Not interchangeable 1:1 like BTC.
  - **Staking**: Locking your crypto to help validate a blockchain network, earning rewards.
    Like earning "interest" on crypto. Available for ETH, Solana, Cardano, etc.
  - **Gas Fee**: Fee paid to the Ethereum network for processing transactions.
    Can be very high during network congestion.

  ### Indian Crypto Exchanges — How to Buy
  - **CoinDCX**: India's largest crypto exchange. Supports 200+ coins. Easy KYC.
  - **WazirX**: Acquired by Binance. Large Indian user base. P2P trading available.
  - **CoinSwitch**: Simple UI, good for beginners. App-first platform.
  - **Zebpay**: One of India's oldest exchanges. Conservative coin selection.
  - **Mudrex**: Index-based crypto investing. Good for diversified crypto exposure.

  How to buy crypto in India:
  Step 1: Download app of chosen exchange.
  Step 2: Complete KYC (PAN, Aadhaar, selfie, bank account).
  Step 3: Deposit INR via UPI, NEFT, or IMPS.
  Step 4: Search for the cryptocurrency (e.g., Bitcoin).
  Step 5: Enter amount in INR you want to invest. Execute buy order.
  Step 6: Crypto reflects in your exchange wallet.
  Step 7: For large amounts, withdraw to a hardware cold wallet for safety.

  ### Indian Tax Rules on Crypto (as per Finance Act 2022)
  - **30% flat tax** on ALL crypto gains. No distinction between short-term and long-term.
  - **1% TDS (Tax Deducted at Source)** on every sell/transfer transaction above ₹50,000/year.
    (₹10,000 threshold for non-specified persons — effectively applies to all).
    The exchange deducts this and deposits with the government. It's not an additional tax —
    it's advance tax credit that you can claim when filing ITR.
  - **No deduction of losses**: If you lose money on one crypto, you CANNOT set it off
    against gains on another crypto. You can only set off losses from crypto within crypto,
    within the same financial year (same VDA category).
  - **No set-off with other income**: Crypto losses cannot offset salary, rental, or other income.
  - **Cost of acquisition**: Only the purchase price is deductible. Mining costs, electricity,
    exchange fees are NOT deductible.
  - **Gifting crypto**: If you gift crypto worth > ₹50,000, recipient pays tax.
  - **Filing**: Report in ITR-2 or ITR-3 under "Income from Virtual Digital Assets (VDA)".

  Example Calculation:
    Bought 0.1 BTC at ₹25,00,000. Sold at ₹35,00,000.
    Gain = ₹10,00,000.
    Tax = 30% × ₹10,00,000 = ₹3,00,000.
    Plus 4% cess = ₹12,000. Total tax = ₹3,12,000.

  ### Crypto Wallet Safety Rules
  1. Never share private key or seed phrase — not with exchange support, not with anyone.
  2. Never enter seed phrase on any website — phishing sites steal it.
  3. Use cold wallet (Ledger/Trezor) for holdings above ₹1 lakh.
  4. Enable 2FA (two-factor authentication) on all exchange accounts.
  5. Use separate email and strong password for crypto exchange.
  6. Verify exchange URLs carefully — fake sites steal login credentials.
  7. Be wary of "free crypto" airdrop scams — they often request wallet connection.
  8. Never connect your wallet to unknown DeFi sites without research.

  ### Crypto Risks in India
  - **Volatility**: Bitcoin has fallen 80% in bear markets. Can lose most value quickly.
  - **Regulatory Risk**: RBI has historically been unfavourable. Government could add more taxes
    or restrictions at any time.
  - **Exchange Hack Risk**: Centralised exchanges can be hacked. WazirX lost $230 million in 2024 hack.
    Lesson: Don't leave large holdings on exchanges.
  - **Rug Pull Risk**: In DeFi/altcoins, project founders can suddenly remove all liquidity
    and disappear. Research thoroughly before investing in small altcoins.
  - **Scam Risk**: Fake platforms, Ponzi crypto schemes, WhatsApp/Telegram pump groups.
  - **No investor protection**: Unlike stocks (SEBI) or FDs (DICGC), crypto has no
    government insurance. If you lose crypto, there is no recourse.

  ### Should I Invest in Crypto?
  Consider these factors:
  - Only invest what you can afford to lose completely.
  - Limit to 5–10% of your total investment portfolio.
  - Start with Bitcoin and Ethereum — more established, higher liquidity.
  - Avoid memecoins, new altcoins without fundamentals.
  - Never borrow money to invest in crypto.
  - Understand the tax implications before starting (30% flat tax).
  - If you're new to investing, start with mutual funds first. Add crypto later.

  ### Crypto Q&A

  Q: Is crypto legal in India?
  A: Yes, trading and investing in crypto is legal in India. It is classified as a
  "Virtual Digital Asset" (VDA). The government taxes it at 30%. RBI does not permit
  banks to directly facilitate crypto transactions but hasn't banned it.

  Q: What is Bitcoin halving?
  A: Every ~4 years, the reward for mining a Bitcoin block is cut in half. This reduces
  new Bitcoin supply. Historically, halving events have been followed by bull runs.
  The most recent halving was in April 2024, cutting block reward to 3.125 BTC.

  Q: Can I recover lost crypto if sent to wrong address?
  A: No. Blockchain transactions are irreversible. Once sent, it cannot be recalled
  unless the recipient sends it back voluntarily. Always double-check the address.

  Q: What is Ethereum 2.0?
  A: Ethereum moved from "Proof of Work" (energy-intensive mining) to "Proof of Stake"
  in September 2022 (called "The Merge"). This reduced Ethereum's energy use by 99.9%
  and allowed ETH staking to earn rewards (~4–5% p.a.).

  Q: What is a crypto scam I should watch out for?
  A: Common scams:
  - "Double your Bitcoin" schemes — impossible. Always a scam.
  - Fake celebrity endorsements for new crypto projects.
  - WhatsApp groups promising guaranteed crypto returns.
  - Romance scams where person online asks you to invest on a fake platform.
  - Pump-and-dump: someone promotes a small coin, you buy at peak, they dump, you lose.
  If anyone promises guaranteed returns from crypto — it's a scam. Report to cybercrime.gov.in.

  Q: What is the difference between a coin and a token?
  A: Coin: Has its own blockchain (Bitcoin, Ethereum, Solana).
  Token: Built on top of an existing blockchain (e.g., USDT is a token on Ethereum).
  Both can be traded. Distinction matters mostly for developers.

  Q: How do I declare crypto income in ITR?
  A: Use ITR-2 (no business income) or ITR-3 (business income). Under Schedule VDA:
  Enter each transaction with date of acquisition, purchase price, sale price, and gain.
  The 1% TDS deducted by exchange will show in Form 26AS as advance tax credit.

