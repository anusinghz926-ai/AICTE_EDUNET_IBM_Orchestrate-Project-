  ## TOPIC 6: SAFE UPI PAYMENTS — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### What is UPI?
  UPI = Unified Payments Interface. A real-time payment system developed by NPCI
  (National Payments Corporation of India). Allows instant 24×7 bank-to-bank transfers
  using a UPI ID, mobile number, or QR code. No need to share bank account details.

  ### How UPI Works
  Step 1: You link your bank account to a UPI-enabled app.
  Step 2: A UPI ID is created (e.g., yourname@okicici, yourphone@ybl).
  Step 3: To pay: Enter recipient's UPI ID or scan QR code → enter amount → enter UPI PIN.
  Step 4: Money moves from your bank to recipient's bank instantly, 24/7/365.
  UPI PIN = 4 or 6 digit PIN set by you. Like ATM PIN for UPI. Never share it.

  ### NPCI-Approved UPI Apps
  - Google Pay (GPay): Backed by Google. Very secure.
  - PhonePe: India's most used UPI app. Secure.
  - Paytm: Also a payments bank. Secure.
  - BHIM: Government's own UPI app. Simple and trustworthy.
  - Amazon Pay, WhatsApp Pay, CRED, Navi: Also NPCI-approved.
  All these apps are safe and regulated. Avoid unknown/unrecognised payment apps.

  ### UPI Safety Golden Rules
  1. **NEVER share your UPI PIN** with anyone — not family, not bank employees, not NPCI,
     not anyone claiming to be from the government.
  2. **Receiving money NEVER needs a PIN**. If someone asks you to enter PIN to receive money
     → it is a scam. You only enter PIN when YOU are sending money.
  3. **Verify the recipient's UPI ID** before paying. A single wrong character goes to wrong person.
  4. **Never scan QR codes from strangers** claiming to send you money.
  5. **Never approve "Collect Requests"** from unknown people. Collect = you are PAYING, not receiving.
  6. **Use screen lock** on your phone. If phone is stolen and unlocked, UPI is accessible.
  7. **Enable per-transaction limits** in your UPI app settings.
  8. **Regularly check your linked bank accounts** in UPI app settings.
  9. **Report suspicious transactions** immediately to your bank and cybercrime.gov.in.

  ### Common UPI Scams — Detect and Avoid

  **Scam 1: "Enter PIN to receive money"**
  How it works: Scammer says "I'm sending you ₹10,000, enter your UPI PIN to accept."
  Reality: Receiving money needs NO PIN. Entering PIN means YOU are sending money TO them.
  Red flag: Anyone asking PIN to receive.

  **Scam 2: QR Code Scam**
  How it works: Scammer shares a QR code saying "Scan this to receive your refund/prize."
  Reality: QR codes from scammers are set to DEBIT you, not credit.
  Red flag: Any QR code that asks you to enter PIN after scanning to receive money.

  **Scam 3: Collect Request Fraud**
  How it works: Scammer sends a "Collect" request for ₹1 (or small amount) to get you
  to enter your PIN. Then sends larger collect requests.
  Reality: Approving collect request = you are paying. Decline all collect requests from unknown people.
  Red flag: Collect request from someone you don't know.

  **Scam 4: Fake Customer Care**
  How it works: Scammer pretends to be bank/UPI customer care. Asks for OTP or UPI PIN
  to "verify" or "resolve" your account issue.
  Reality: Banks NEVER ask for OTP or PIN over call. Legitimate customer care never needs it.
  Red flag: Any call asking for OTP, PIN, or asking you to download any app (like AnyDesk).

  **Scam 5: Screen Sharing Scam**
  How it works: Scammer asks you to download screen-sharing app (AnyDesk, TeamViewer, QuickSupport)
  for "technical support." Once you share screen, they see your UPI app and steal money.
  Reality: No bank or government agency needs screen access. Hang up immediately.
  Red flag: Anyone asking to install a remote access app.

  **Scam 6: Fake Payment Screenshot**
  How it works: Scammer sends a fake screenshot showing they've paid you ₹50,000.
  Asks you to return ₹50,000 or send goods in "exchange." No real payment was made.
  Reality: Always verify in your bank statement or UPI transaction history before acting.
  Red flag: Screenshot as "proof" of payment instead of transaction ID.

  **Scam 7: Lottery/Prize via UPI**
  How it works: "You've won ₹5 lakh in KBC/lucky draw. Pay ₹2,000 processing fee via UPI."
  Reality: No legitimate lottery takes a fee upfront. This is a classic advance fee fraud.
  Red flag: Prize/lottery that asks for upfront payment.

  ### What to Do if Scammed via UPI
  Step 1: Immediately call your bank's 24×7 helpline and ask them to block your UPI.
  Step 2: Call **1930** (Cyber Crime Helpline) to report and initiate transaction hold.
  Step 3: File complaint at https://cybercrime.gov.in
  Step 4: Note the transaction ID, date, amount, and recipient UPI ID/name.
  Step 5: File FIR at local police station (Cyber Cell) if amount is large.
  Step 6: Email grievance to NPCI: help@npci.org.in

  Prompt reporting within 24 hours is crucial for fund recovery.

  ### UPI Transaction Limits
  - Per transaction: Up to ₹1 lakh (varies by bank; some banks limit to ₹25,000 per transaction).
  - Per day: Up to ₹1 lakh (can be raised via bank if needed).
  - UPI Lite: Small transactions up to ₹500 each without PIN.
  - Some banks allow ₹2 lakh for verified customers.
  - P2M (Person-to-Merchant) may have different limits.

  ### UPI Q&A

  Q: I sent money to the wrong UPI ID. Can I get it back?
  A: Contact your bank immediately. They will raise a dispute with the recipient's bank.
  If the recipient cooperates, money is returned. If not, you must approach the banking
  ombudsman or consumer court. This is why verifying the UPI ID BEFORE paying is critical.

  Q: Is there a charge for UPI transactions?
  A: For person-to-person (P2P) transfers: FREE. No charge.
  For person-to-merchant (P2M): Also free for consumers. Merchants pay a small MDR (Merchant Discount Rate).

  Q: What is UPI 123Pay?
  A: A service for feature phone users (non-smartphone) to use UPI via IVR (voice-based),
  missed calls, or SMS. Expands UPI access to rural/feature-phone users.

  Q: What is the difference between IMPS, NEFT, RTGS and UPI?
  A: UPI: Instant, 24×7, free, up to ₹1 lakh/txn.
  IMPS: Instant, 24×7, small charge (₹2–25), up to ₹5 lakh/txn.
  NEFT: Batch-based, bank hours, free online, up to no fixed limit.
  RTGS: Real-time, for large amounts ≥ ₹2 lakh, free online. Use for large transfers.
  For daily payments: UPI is best. For large transfers (>₹1L): Use NEFT or RTGS.

