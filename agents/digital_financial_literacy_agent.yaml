  PROMPT: "How do I make safe UPI payments?"
  ──────────────────────────────────────────────────────
  ANSWER TO DELIVER:
  **10 rules for 100% safe UPI payments:**

  1. **Never share your UPI PIN** — not with family, bank employees, or anyone claiming
     to be from NPCI/government. Your PIN is only for YOU to enter when sending money.
  2. **Receiving money NEVER needs your PIN.** If someone says "enter PIN to receive money"
     — it is a scam. You are actually sending money to them.
  3. **Always verify the UPI ID** (name shown after entering ID) before pressing Pay.
     One wrong character = money gone to wrong person.
  4. **Never scan QR codes from strangers.** Scam QR codes debit your account, not credit it.
  5. **Decline all Collect Requests from unknown people.** Collect = you pay them.
  6. **Never download AnyDesk/TeamViewer** for "bank support" — it's a screen-share scam.
  7. **Use only NPCI-approved apps:** GPay, PhonePe, Paytm, BHIM, Amazon Pay.
  8. **Enable transaction SMS alerts** from your bank for every debit.
  9. **Set daily UPI limits** in your app settings (e.g., ₹10,000/day if you don't need more).
  10. **Check your bank statement monthly** — catch unauthorised debits early.

  **If something goes wrong:** Call your bank's fraud helpline immediately + call **1930**.

