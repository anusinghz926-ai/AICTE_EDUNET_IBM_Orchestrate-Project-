  ## TOPIC 5: OTHER INVESTMENT PRODUCTS — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### PPF — Public Provident Fund

  **What is PPF?**
  PPF is a government-backed long-term savings scheme. Opened at banks or post offices.
  Offers guaranteed, tax-free returns backed by the Government of India.

  **Key Features:**
  - Interest rate: 7.1% p.a. (reviewed quarterly by government; has been stable)
  - Tenure: 15 years (extendable in 5-year blocks after maturity)
  - Maximum investment: ₹1,50,000 per financial year
  - Minimum investment: ₹500 per year (must maintain account)
  - Tax status: EEE — Exempt-Exempt-Exempt
    E1: Investment up to ₹1.5L deductible under Section 80C
    E2: Interest earned is completely tax-free
    E3: Maturity amount is completely tax-free
  - Loan facility: Available from 3rd year up to 25% of balance
  - Partial withdrawal: Allowed from 7th year
  - Lock-in: 15 years (premature closure only in case of death or life-threatening illness)

  **PPF Calculation:**
  At 7.1% for 15 years, investing ₹1,50,000/year:
  Approximate corpus: ~₹40–42 lakhs (fully tax-free)
  Total invested: ₹22.5 lakhs. Tax-free gains: ~₹18–20 lakhs.

  **PPF Q&A:**

  Q: Can I open PPF for my child?
  A: Yes. You can open a minor PPF account in your name as guardian. However, the ₹1.5L
  limit is combined — your account + minor's account combined cannot exceed ₹1.5L/year.

  Q: Can NRI have PPF account?
  A: No. NRIs cannot open new PPF accounts. Existing accounts opened before becoming NRI
  can be continued till maturity but cannot be extended.

  Q: Is PPF better than ELSS for tax saving?
  A: PPF: Safe, guaranteed returns (7.1%), tax-free, but 15-year lock-in.
  ELSS: Market-linked (12–15% potential), only 3-year lock-in, LTCG tax applies.
  For risk-averse investors: PPF. For young investors with 10+ year horizon: ELSS gives more wealth.
  Best strategy: Use both — PPF for safety, ELSS for growth.

  ---

  ### NPS — National Pension System

  **What is NPS?**
  NPS is a voluntary retirement savings scheme regulated by PFRDA (Pension Fund Regulatory
  and Development Authority). Your contributions are invested in a mix of equity, corporate
  bonds, and government securities, chosen by you.

  **Key Features:**
  - Two account types:
    Tier 1: Primary retirement account. Lock-in till age 60. Tax benefits available.
    Tier 2: Voluntary savings, freely withdrawable. No special tax benefit.
  - Minimum contribution: ₹500/year for Tier 1, ₹1,000 to activate.
  - Tax benefits:
    - Section 80CCD(1): Contribution up to 10% of salary (max ₹1.5L under 80C umbrella)
    - Section 80CCD(1B): Additional ₹50,000 deduction OVER the ₹1.5L limit (exclusive benefit)
    - Section 80CCD(2): Employer contribution up to 10% of salary is fully deductible
  - At 60: 60% can be withdrawn as lump sum (tax-free). 40% must be used to buy annuity.
  - Annuity = regular pension income from an insurance company. Taxable as income.
  - Fund managers: SBI Pension Funds, HDFC Pension, ICICI Pru Pension, Kotak Pension.
  - Asset classes: Equity (E), Corporate Bonds (C), Government Securities (G), Alternative (A).

  **Auto vs Active Choice:**
  Auto: Allocation automatically reduces equity % as you age (starts 75% equity at 35, reduces to 50% by 55).
  Active: You choose the % yourself. Max 75% equity allowed up to age 50; reduces after.

  **NPS Q&A:**

  Q: Is NPS better than PPF?
  A: NPS: Market-linked (potentially 10–12% CAGR), extra ₹50K tax deduction, but 40%
  locked in annuity at 60.
  PPF: Guaranteed 7.1%, full tax-free withdrawal, but no equity growth.
  Best approach: Both. Use PPF for safety + NPS for growth + extra ₹50K tax saving.

  Q: Can I withdraw NPS before 60?
  A: Yes but with restrictions:
  - Partial withdrawal (up to 25% of own contributions) allowed after 3 years for specific
    purposes (children's education/marriage, home purchase, medical treatment).
  - Premature exit before 60: 80% must be used to buy annuity; only 20% as lump sum.
    Exception: If corpus < ₹5 lakh, entire amount can be withdrawn.

  ---

  ### Gold Investment

  **Physical Gold**: Jewellery, bars, coins. Risks: Making charges, storage, purity concerns.
  Not the best investment form. Making charges (10–25%) are a sunk cost.

  **Sovereign Gold Bonds (SGB):**
  Issued by RBI on behalf of Government of India. Denominated in grams of gold.
  - Interest: 2.50% p.a. (paid semi-annually) on the issue price — OVER gold price appreciation.
  - Tax: Capital gains on maturity (8 years) are COMPLETELY EXEMPT from tax.
    This makes SGB the most tax-efficient gold investment.
  - Minimum: 1 gram. Maximum: 4 kg per person per financial year.
  - Can be bought on stock exchanges (NSE/BSE) after listing or directly from banks during issuance.
  - If sold before 8 years in secondary market: LTCG (>3 years) at 20% with indexation applies.

  **Gold ETF:**
  Electronic form of gold. 1 unit = 1 gram (approx). Traded on stock exchange.
  No TDS. Demat account needed. LTCG (>3 years): 20% with indexation (less tax-efficient than SGB).

  **Gold Mutual Fund:**
  Fund of funds that invests in Gold ETFs. SIP possible. No demat needed.
  Useful for small monthly gold SIPs.

  **Gold vs Other Investments:**
  Gold is a hedge against inflation and currency depreciation. It performs well during global
  uncertainty (COVID, wars, financial crises). However, it doesn't generate income (unlike stocks
  which pay dividends, or FD which pays interest). Limit gold to 5–10% of portfolio.

  ---

  ### Real Estate and REITs

  **Direct Real Estate:**
  Requires large capital (₹30 lakh+), illiquid (takes months to sell), high transaction costs
  (stamp duty 5–8%, registration, brokerage). Rental yield in India is typically only 2–3% p.a.
  Capital appreciation varies widely by location. Good for long-term wealth but poor liquidity.

  **REITs (Real Estate Investment Trusts):**
  SEBI-regulated. Pools investor money to own income-generating real estate (offices, malls).
  Distributes 90%+ of rental income as dividends to investors.
  - Listed on NSE/BSE. Can invest with ₹10,000–15,000.
  - Regular dividend income (typically 6–8% distribution yield).
  - Liquidity: Can buy/sell on exchange like stocks.
  - Examples in India: Mindspace REIT, Embassy REIT, Nexus Select Trust, Brookfield REIT.
  - Tax: Distributions partially taxable (depends on components — capital return vs income).

  ---

  ### Insurance Products

  **Term Insurance (Recommended):**
  Pure life cover. You pay premium; if you die during tenure, nominee gets sum assured.
  No maturity benefit if you survive (no savings component). Premiums very low.
  Example: ₹1 crore cover at age 30 → ₹8,000–12,000/year premium.
  Buy from: PolicyBazaar, LIC Tech Term, HDFC Click 2 Protect, ICICI iProtect Smart.
  Rule: Life insurance cover = 10–15× your annual income.

  **ULIP (Unit Linked Insurance Plan) — Avoid:**
  Combines insurance + investment. Sounds good but: very high charges (premium allocation,
  fund management, mortality) eat into returns. Actual investment is much less than what you pay.
  Returns underperform pure mutual funds significantly after charges.
  Better approach: Buy term insurance separately + invest the rest in mutual funds.

  **Endowment/Money-Back Plans — Avoid:**
  Traditional LIC-style policies that promise guaranteed returns at maturity.
  Actual returns: 4–6% p.a. — lower than FDs, significantly lower than mutual funds.
  Lock-in of 15–25 years. Not recommended for wealth building.

  **Health Insurance (Essential):**
  Everyone needs it. Medical costs in India are rising rapidly.
  Minimum: ₹5 lakh individual / ₹10 lakh family floater cover.
  Buy from: Star Health, HDFC ERGO, Niva Bupa, Care Health.
  Key checks: Cashless hospital network, room rent limit (avoid sublimits), waiting period.
  Don't rely solely on employer health insurance — it ends if you change jobs.

  **Other Insurance Products:**
  - Critical Illness Cover: Pays lump sum on diagnosis of critical illness (cancer, heart attack).
  - Personal Accident Cover: Covers accidental disability/death. Very affordable.
  - Motor Insurance: Mandatory for vehicles. Comprehensive > Third-party only.

