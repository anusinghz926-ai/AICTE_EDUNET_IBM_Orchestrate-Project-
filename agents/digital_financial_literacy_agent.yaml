  ### FD Question & Answer Bank

  Q: What is the safest FD option in India?
  A: SBI, HDFC, ICICI, Kotak, and Axis are the safest because they are large, well-capitalised
  banks regulated by RBI. All deposits up to ₹5 lakh are insured by DICGC.

  Q: Should I split FDs across banks to get more DICGC coverage?
  A: Yes. If you have ₹15 lakhs to invest, putting ₹5L in ICICI, ₹5L in HDFC, and ₹5L in SBI
  gives you ₹15L total DICGC coverage. Keeping all ₹15L in one bank only insures ₹5L.

  Q: Is FD interest taxable?
  A: Yes. FD interest is added to your total income and taxed as per your income tax slab.
  If interest exceeds ₹40,000/year (₹50,000 for seniors), the bank deducts TDS at 10%.
  If you are not a taxpayer, submit Form 15G (under 60) or Form 15H (60+) to avoid TDS.

  Q: What is a Tax-Saving FD?
  A: A 5-year FD under Section 80C of the Income Tax Act. You can claim deduction up to
  ₹1,50,000 per year. However, there is a 5-year lock-in — premature withdrawal not allowed.
  Interest earned is still taxable. Available at all major banks.

  Q: What happens if I break an FD early?
  A: You get back your principal plus interest earned so far, minus a penalty. Penalty is
  typically 0.50% to 1.00% less than the rate applicable for the period you actually kept the FD.
  Example: You booked 2-year FD at 7.20%, but withdrew after 1 year (1-year rate was 6.70%).
  You get 6.70% - 1.00% = 5.70% for the 1 year held.

  Q: Is FD better than savings account?
  A: For money you won't need for 6 months or more — YES. FD rates (6–8%) are much higher
  than savings account rates (2.70–4.00%). Only keep 3–6 months of expenses in savings;
  invest the rest in FD for better returns.

  Q: What is a Flexi FD or Sweep-In FD?
  A: A Flexi FD is linked to your savings account. If your savings balance exceeds a threshold
  (e.g., ₹25,000), the excess is automatically moved into an FD earning higher interest.
  If you need cash, the FD breaks in units to fund withdrawals. Best of both worlds:
  FD returns + savings liquidity. Available at HDFC (SweepIn), ICICI (Money Multiplier), Kotak (ActivMoney).

  Q: What is a recurring deposit (RD)? How is it different from FD?
  A: RD = you deposit a fixed amount every month for a fixed period. FD = you deposit a lump sum.
  RD is better if you don't have a large lump sum but want to save monthly.
  Rates are similar. Interest is compounded quarterly on RD too.

  Q: Can an NRI open an FD in India?
  A: Yes. NRIs can open:
  - NRE FD: Rupee-denominated; principal + interest fully repatriable; interest tax-free in India.
  - NRO FD: For India-earned income; interest taxable in India; repatriation limits apply.
  - FCNR FD: Foreign currency FD (USD, GBP, EUR etc.); no exchange rate risk.

  Q: What is the minimum amount to open an FD?
  A: Varies by bank. SBI: ₹1,000. HDFC: ₹5,000. ICICI: ₹10,000. Kotak: ₹5,000.
  Small finance banks often accept ₹1,000.

  Q: Which bank FD is best for 1 year right now?
  A: Based on 2025 rates: IndusInd Bank (7.75%) and Yes Bank (7.25%) offer the highest
  1-year rates among major banks. Kotak (7.10%) and ICICI (6.70%) are strong too.
  For safety-first investors: IndusInd or Kotak. For maximum return: IndusInd (7.75%).

  Q: My FD matured. What should I do?
  A: You have 3 options:
  1. Reinvest in a new FD at the current rate.
  2. Move to a better-performing bank if rates have improved elsewhere.
  3. Move to mutual funds or other instruments if your risk appetite allows.
  If you don't act, the bank auto-renews at the prevailing rate, which may be lower.

  Q: What is the difference between cumulative and non-cumulative FD?
  A: Cumulative FD: Interest compounds and is paid at maturity along with principal.
  Better for wealth accumulation.
  Non-Cumulative FD: Interest is paid out monthly/quarterly/half-yearly. Better for
  retirees who need regular income.

  Q: Can I get a loan against FD?
  A: Yes. Banks give loans of 75–95% of the FD value at a rate 1–2% above the FD rate.
  This is cheaper than a personal loan (which charges 10–24%). Your FD continues earning
  interest while you use the loan. This is a smart way to meet short-term cash needs.

  Q: Is FD a good investment for retirement?
  A: FD is good for the portion of your portfolio that needs to be safe and liquid.
  However, returns (6–8%) may not beat inflation (5–7%) over the long term.
  For retirement, combine: FD (safe/liquid portion) + PPF (long-term tax-free) +
  mutual funds (growth) + SGB (gold hedge). Don't rely on FD alone.

  Q: How is FD different from PPF?
  A: FD: Flexible tenure (7 days to 10 years), taxable interest, higher rates available,
  fully liquid (with penalty).
  PPF: 15-year lock-in, 7.1% tax-free, max ₹1.5L/year, EEE (triple exempt).
  Use FD for short-to-medium term goals; PPF for long-term retirement corpus.

  Q: What is the best FD tenure to choose?
  A: It depends on your goal:
  - Emergency backup: 3–6 months tenure (liquid, accessible)
  - Short-term goals (1–2 years): Kotak 390-day (7.40%) or IndusInd 1-year (7.75%)
  - Medium-term goals (2–3 years): HDFC/ICICI 2-year (7.00–7.20%)
  - Tax saving: 5-year tax-saver FD (Section 80C)
  Generally, 1–2 year tenures offer the best rates currently.

  Q: Senior citizen FD — what extra benefit do I get?
  A: Most banks offer +0.25% to +0.75% above regular rates for depositors aged 60+.
  Example: IndusInd regular 7.75% → senior citizen 8.25%.
  Some banks offer an additional +0.25% for "super senior citizens" (80+ years).
  Senior citizen FD interest up to ₹50,000 per year is exempt under Section 80TTB.

  Q: What is Form 15G / 15H? When do I need to submit it?
  A: Form 15G: For individuals below 60 years with income below taxable limit.
  Submit to avoid TDS on FD interest. Declare that your total income is below ₹2.5 lakh.
  Form 15H: Same purpose, for senior citizens (60+). Income limit is ₹3 lakh.
  Submit at the beginning of each financial year to each bank where you have FDs.

  Q: How do I calculate how much I will earn from my FD?
  A: Use this step-by-step:
  Step 1: Note your Principal (P), Rate (r as decimal), Tenure in years (t)
  Step 2: Apply A = P × (1 + r/4)^(4t)
  Step 3: Interest = A - P
  Example: ₹2,00,000 at 7.75% (IndusInd) for 2 years:
    A = 2,00,000 × (1 + 0.0775/4)^8
    A = 2,00,000 × (1.019375)^8
    A = 2,00,000 × 1.16728
    A = ₹2,33,456
  Interest earned = ₹33,456

  Q: What should I do if my bank fails?
  A: DICGC pays up to ₹5 lakh per depositor per bank within 90 days of the bank's
  liquidation. If your FD is below ₹5 lakh — you are fully protected.
  If above ₹5 lakh — only ₹5 lakh is guaranteed; rest depends on liquidation recovery.
  Prevention: Keep any single bank FD exposure within ₹5 lakh.

