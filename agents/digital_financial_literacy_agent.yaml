  ## TOPIC 8: LOAN TERMS & BUDGETING — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### Key Loan Terms Explained

  **Principal**: The amount you borrow. Example: You take a ₹10 lakh personal loan.
  Principal = ₹10,00,000.

  **Interest Rate**: The cost of borrowing, expressed as % per year (p.a.).
  Types:
  - Fixed rate: Rate doesn't change throughout tenure. Predictable EMI.
  - Floating rate: Changes with market rates (linked to RBI repo rate). EMI can go up or down.
  - Flat rate (declining balance vs flat): Flat rate is misleading — actual effective rate is ~2×.
    Example: 10% flat rate = roughly 18% effective rate. Always ask for "reducing balance rate."

  **EMI (Equated Monthly Instalment)**: Fixed amount you pay every month to repay the loan.
  Includes both principal repayment and interest. Same amount every month for tenure.

  **EMI Formula**:
    EMI = P × r × (1 + r)^n / ((1 + r)^n - 1)
  Where:
    P = Principal loan amount
    r = Monthly interest rate (Annual rate ÷ 12 ÷ 100)
    n = Tenure in months

  Example: ₹5,00,000 personal loan at 14% for 3 years (36 months):
    r = 14/12/100 = 0.01167
    EMI = 5,00,000 × 0.01167 × (1.01167)^36 / ((1.01167)^36 - 1)
    EMI = 5,00,000 × 0.01167 × 1.5125 / 0.5125
    EMI ≈ ₹17,090/month
  Total paid = ₹17,090 × 36 = ₹6,15,240
  Total interest paid = ₹1,15,240

  **Tenure**: Duration of the loan in months or years.
  Longer tenure = lower EMI but higher total interest paid.
  Shorter tenure = higher EMI but lower total interest.

  **Processing Fee**: One-time fee charged when loan is approved. Usually 0.5–2% of loan.
  Example: ₹5 lakh loan with 1% processing fee = ₹5,000 upfront cost.

  **Prepayment Penalty / Foreclosure Charge**: Fee charged if you pay off loan before tenure ends.
  - Floating rate home loans (individual borrowers): RBI has banned prepayment charges.
  - Fixed rate loans: Lender may charge 2–5% of outstanding principal.
  - Personal loans: Varies. Check before taking.

  **CIBIL Score / Credit Score**:
  A 3-digit score (300–900) representing your creditworthiness, calculated by credit bureaus
  (CIBIL, Experian, CRIF, Equifax) based on your credit history.

  | Score Range | Category      | Loan Terms               |
  |-------------|---------------|--------------------------|
  | 750–900     | Excellent      | Best rates, quick approval |
  | 700–749     | Good           | Good rates                |
  | 650–699     | Fair           | Higher rates, may face rejection |
  | 600–649     | Poor           | NBFCs only, very high rates |
  | <600        | Very Poor      | Mostly rejected           |

  How to check: Free at paisabazaar.com, BankBazaar, or CIBIL official site.
  Check once a year. Dispute errors immediately.

  How to improve CIBIL:
  - Pay all loan EMIs and credit card bills on time — every month, no exception.
  - Keep credit card utilisation below 30% (use < ₹30,000 if limit is ₹1 lakh).
  - Don't apply for multiple loans/cards simultaneously (too many hard inquiries lower score).
  - Maintain a mix of credit (credit card + loan) — shows you can manage both.
  - Keep old credit cards open (even if unused) — longer credit history = better score.

  **Loan Against Property (LAP)**: Mortgage your property to get funds.
  Loan = 40–70% of property value. Rate: 9–13%. For large business/personal needs.

  ### Personal Budgeting — Complete Framework

  **Step 1: Know Your Income**
  List all monthly income sources:
  - Take-home salary (after PF, tax deduction)
  - Freelance/business income (variable — use 3-month average)
  - Rental income, dividends, interest income

  **Step 2: Categorise Your Expenses**
  Needs (essential, non-negotiable):
  - Rent/EMI, groceries, utilities, transport, medical, education

  Wants (lifestyle, discretionary):
  - Dining out, entertainment, subscriptions, shopping, vacations

  Savings & Investments:
  - Emergency fund, mutual fund SIPs, PPF, NPS, loan prepayment

  **Step 3: Apply the 50-30-20 Rule**
  50% of take-home salary → Needs
  30% of take-home salary → Wants
  20% of take-home salary → Savings & Investments

  Example for ₹60,000/month take-home:
  - Needs: ₹30,000 (rent ₹15K, groceries ₹6K, transport ₹4K, utilities ₹3K, misc ₹2K)
  - Wants: ₹18,000 (dining ₹5K, entertainment ₹3K, shopping ₹7K, subscriptions ₹3K)
  - Savings: ₹12,000 (SIP ₹8K, PPF ₹2K, emergency fund ₹2K)

  **Step 4: Emergency Fund**
  Target: 3–6 months of monthly expenses set aside in a liquid, accessible account.
  Why: Job loss, medical emergency, car repair — life is unpredictable.
  Where to keep: SBI Liquid Fund (instant redemption, ~7%), high-interest savings account.
  Don't invest emergency fund in equity/FD with lock-in.

  Building emergency fund:
  If you have nothing saved, set aside ₹2,000–5,000 every month in a liquid fund.
  Reach 3-month target before aggressively investing in equity.

  **Step 5: Tracking and Reviewing**
  Apps to track spending: Walnut, Money Manager, Splitwise, YNAB (free versions available).
  Review every month: Did you overspend on wants? Can you increase savings?
  Increase SIP by 10% every year (salary hike → SIP hike).

  ### Debt Management

  **Good Debt vs Bad Debt:**
  Good debt: Home loan (asset appreciates, tax benefit), education loan (increases earning power).
  Bad debt: Personal loan for vacation, credit card debt for shopping, buy-now-pay-later overuse.

  **Debt Snowball Method (for multiple loans):**
  Pay minimum EMI on all loans. Put all extra money on the smallest loan first.
  Once smallest paid off → roll that payment to the next smallest.
  Psychological win of eliminating loans keeps you motivated.

  **Debt Avalanche Method (saves most interest):**
  Pay minimum on all. Put extra money on the highest-interest loan first.
  Most mathematically efficient. Saves more in total interest.

  **Credit Card Management:**
  - Pay FULL outstanding amount before due date every month. Never minimum payment only.
  - Why: Credit card interest rate is 36–48% per year. Even one month of revolving interest
    can cost thousands.
  - Never use credit card for cash advance — 2.5–3.5% fee + 36–48% interest from day 1.
  - Set auto-pay for full amount if you tend to forget.
  - Keep credit card limit utilisation below 30%.

  ### Budgeting Q&A

  Q: I spend more than I earn every month. What should I do?
  A: Start by tracking every expense for 1 month. Most people are shocked by "small" expenses
  (daily coffee ₹120 × 30 = ₹3,600/month). Then:
  1. Identify top 3 spending categories.
  2. Cut wants — reduce one subscription, cook at home 3 more days/week.
  3. Negotiate — call your internet/mobile provider for better rate.
  4. Increase income — freelance, overtime, sell unused items.

  Q: How much emergency fund do I need?
  A: 3 months minimum. 6 months if you are self-employed or have dependents.
  Formula: Monthly expenses × 3 (or 6) = emergency fund target.
  Example: Monthly expenses ₹35,000 × 3 = ₹1,05,000 emergency fund.

  Q: Should I save first or pay off loans first?
  A: Rule: If loan interest rate > expected investment return → pay loan first.
  Credit card at 40%: Pay off FULLY before investing. Any investment return < 40%.
  Personal loan at 14%: May be worth investing in equity (expected 12–15%) while paying EMI.
  Emergency fund: Build ₹50,000 minimum even while paying loans — otherwise one emergency = more debt.

  Q: What is a systematic investment vs systematic saving?
  A: Saving = keeping money in bank/savings (low return). Investing = putting money to work
  (higher return with some risk). Ideal approach: Save for emergency fund + short-term needs.
  Invest for long-term goals (retirement, house, child education).

