  ## TOPIC 2: STOCK MARKET — COMPLETE KNOWLEDGE BASE
  ═══════════════════════════════════════════════════════════════

  ### What is the Stock Market?
  A stock market is a platform where shares (small ownership pieces) of publicly listed
  companies are bought and sold. In India, the two main exchanges are:
  - **NSE (National Stock Exchange)**: India's largest; benchmark index = NIFTY 50.
  - **BSE (Bombay Stock Exchange)**: Asia's oldest; benchmark index = SENSEX (30 stocks).
  Both are regulated by SEBI (Securities and Exchange Board of India).

  ### Key Stock Market Terms
  - **Share/Stock**: A unit of ownership in a company. If you own 100 shares of a company
    that has issued 1,00,000 shares, you own 0.1% of it.
  - **Market Capitalisation**: Share price × total shares. Classifies companies:
    - Large-cap: > ₹20,000 crore (e.g., Reliance, TCS, HDFC Bank)
    - Mid-cap: ₹5,000–20,000 crore (e.g., Tata Communications, Mphasis)
    - Small-cap: < ₹5,000 crore (e.g., smaller niche companies)
  - **NIFTY 50**: Index of 50 largest companies on NSE. Acts as India's market barometer.
  - **SENSEX**: Index of 30 largest companies on BSE.
  - **Bull Market**: Market is rising overall; investor sentiment positive.
  - **Bear Market**: Market is falling 20%+ from recent high; investor sentiment negative.
  - **IPO (Initial Public Offering)**: When a private company first lists its shares
    for public purchase on the stock exchange.
  - **Dividend**: A portion of company profits distributed to shareholders.
  - **Demat Account**: Dematerialised account that holds your shares electronically.
    Required to buy/sell shares in India. Opened through a broker (Zerodha, Groww, etc.)
  - **Trading Account**: Used to execute buy/sell orders. Usually comes with demat account.
  - **Broker**: Intermediary between buyer and seller. Examples: Zerodha, Groww, Upstox,
    Angel One, ICICI Direct, HDFC Securities.
  - **SEBI**: Regulator of Indian capital markets. Protects investor interests.
  - **Circuit Breaker**: Upper circuit = max price rise in a day. Lower circuit = max fall.
    Usually 5%, 10%, or 20% depending on the stock.

  ### How to Open a Demat and Trading Account
  Step 1: Choose a broker — Zerodha (lowest cost), Groww (easiest for beginners),
          Upstox, Angel One, or your bank (ICICI Direct, HDFC Sec, SBI Sec).
  Step 2: Complete KYC — Aadhaar, PAN card, bank account details, selfie.
  Step 3: In-person verification (IPV) — done via video call or branch visit.
  Step 4: Account activated in 1–3 days.
  Step 5: Add funds to your trading account (linked bank account).
  Step 6: Start placing orders.
  Cost: Zerodha charges ₹20/trade (flat). Groww charges 0.05% or ₹20 max. Full-service
  brokers charge 0.3–0.5% per trade.

  ### Fundamental Analysis — How to Evaluate a Stock
  Fundamental analysis = studying a company's financial health to decide if its stock
  is worth buying.

  Key Metrics:
  - **P/E Ratio (Price-to-Earnings)**: Share price ÷ EPS. Tells you how much you pay
    for ₹1 of earnings. Lower P/E = cheaper. Compare to sector average.
    Example: If P/E = 20, you pay ₹20 for every ₹1 of annual profit.
  - **EPS (Earnings Per Share)**: Net profit ÷ total shares. Higher EPS = more profitable.
  - **Revenue Growth**: Is the company's sales growing year-on-year? Look for 15%+ growth.
  - **Net Profit Margin**: Net profit ÷ Revenue × 100. Higher = more efficient.
  - **Debt-to-Equity Ratio**: Total debt ÷ shareholder equity. < 1 is generally safe.
    High debt companies are riskier, especially in high-interest-rate environments.
  - **ROE (Return on Equity)**: Net profit ÷ shareholder equity × 100.
    ROE > 15% is generally considered good.
  - **Free Cash Flow**: Cash generated after capital expenditure. Positive FCF = healthy.
  - **Promoter Holding**: % of shares held by company founders/management.
    High promoter holding (>50%) = confidence in their own business.
  - **FII/DII Holding**: Foreign/domestic institutional investors holding. Rising = positive.

  ### Technical Analysis — Reading Charts
  Technical analysis = studying price charts and patterns to predict future movement.

  Key Concepts:
  - **Support Level**: A price floor where the stock has repeatedly stopped falling.
    If stock bounces at ₹500 three times, ₹500 is a support.
  - **Resistance Level**: A price ceiling where the stock has repeatedly stopped rising.
  - **Moving Average (MA)**: Average price over a period. 50-day MA, 200-day MA.
    When stock crosses above 200-day MA = bullish signal.
  - **RSI (Relative Strength Index)**: Measures speed/change of price movements. 0–100.
    RSI > 70 = overbought (potential fall). RSI < 30 = oversold (potential rise).
  - **MACD (Moving Average Convergence Divergence)**: Shows momentum.
    MACD line crossing above signal line = buy signal. Below = sell signal.
  - **Volume**: Number of shares traded. Rising price + rising volume = strong trend.
    Rising price + falling volume = weak trend (possibly reversing).
  - **Candlestick Patterns**: Doji, Hammer, Engulfing, Morning Star — patterns that
    signal reversals or continuations. Useful for short-term traders.

  ### Stock Market Tax Rules (India)
  - **STCG (Short-Term Capital Gain)**: Shares sold within 1 year of buying.
    Tax rate: 15% flat (Budget 2024 onwards: 20%).
  - **LTCG (Long-Term Capital Gain)**: Shares sold after 1 year.
    Tax rate: 10% on gains exceeding ₹1 lakh per financial year.
    Gains up to ₹1 lakh per year = tax-free.
  - **STT (Securities Transaction Tax)**: Charged on every buy/sell. ~0.1% on delivery trades.
  - **Dividend income**: Added to your income and taxed at your slab rate.
  - **Loss set-off**: STCL can be set off against STCG or LTCG.
    LTCL can only be set off against LTCG. Carry forward for 8 years.

  ### How to Invest in Stocks — Step by Step
  For beginners: Start with large-cap index ETFs, not individual stocks.
  Step 1: Open Demat + trading account.
  Step 2: Start with Nifty 50 Index ETF (e.g., Nippon India Nifty 50 BeES) or
          Nifty 50 Index Fund — this gives instant diversification across 50 companies.
  Step 3: Invest via SIP (monthly fixed amount) to reduce timing risk.
  Step 4: After 6 months of learning, start researching individual stocks using
          fundamental analysis (screener.in, moneycontrol.com, tickertape.in).
  Step 5: Never invest more than 5% of your portfolio in a single stock initially.
  Step 6: Review quarterly results of companies you own.

  ### IPO — How to Apply
  An IPO lets you buy shares of a company before it lists on the exchange.

  Steps to apply for an IPO via UPI method:
  1. Open a Demat account.
  2. When an IPO opens (usually 3 days), go to your broker app or bank app.
  3. Select the IPO, choose number of lots (minimum 1 lot = usually 10–15 shares).
  4. Enter your UPI ID. A mandate request will come on your UPI app.
  5. Approve the mandate (this blocks — not debits — the money).
  6. On allotment day (T+6): If allotted, shares credited to Demat. If not, money unblocked.
  7. Shares list on exchange after allotment. You can sell on listing day or hold.

  Grey Market Premium (GMP): Unofficial price indicator before listing. Higher GMP = higher
  expected listing gain. But GMP is unofficial — do not make decisions based solely on GMP.

  ### Sectoral Analysis
  - **IT Sector**: TCS, Infosys, Wipro, HCL Tech. Driven by global tech spending.
    Risk: US recession, rupee appreciation reduce dollar earnings.
  - **Banking Sector**: HDFC Bank, ICICI Bank, SBI, Kotak. Driven by credit growth, NIM.
    Risk: Rising NPAs (bad loans), interest rate changes.
  - **Pharma Sector**: Sun Pharma, Dr. Reddy's, Cipla. Driven by domestic + export demand.
    Risk: US FDA observations, pricing pressure in generics.
  - **FMCG Sector**: HUL, ITC, Nestlé. Stable, low-risk, slow-growing.
    Risk: Input cost inflation, rural demand slowdown.
  - **Auto Sector**: Maruti, Tata Motors, M&M, Bajaj Auto. Driven by EVs, rural demand.
    Risk: Commodity prices (steel, aluminium), EV transition disruption.
  - **Infrastructure/Capital Goods**: L&T, ABB, Siemens. Driven by government capex.
    Risk: Project delays, interest rate sensitivity.

  ### Stock Market Q&A

  Q: How much money do I need to start investing in stocks?
  A: You can start with as little as ₹500. Many brokers allow fractional ETF purchases.
  For regular investing, start a SIP of ₹1,000/month in a Nifty 50 index fund.

  Q: Is the stock market gambling?
  A: No — if you invest in quality companies for the long term or index funds.
  Speculation in F&O (Futures and Options) is more like gambling and causes 90%+ losses.
  Long-term equity investing in fundamentally strong companies has historically delivered
  12–15% CAGR in India.

  Q: What is F&O trading? Should I do it?
  A: F&O = Futures and Options. Complex derivative instruments. SEBI data shows that
  over 90% of F&O traders lose money. As a beginner or intermediate investor, avoid F&O.
  Focus on equity delivery (buying actual shares) and mutual fund SIPs.

  Q: Which is the best stock to buy right now?
  A: Rather than single stocks, consider index funds for safety. If you want individual
  stocks, research companies in growing sectors (defence, capex, digital infrastructure).
  Always do your own research using screener.in and check P/E, debt, revenue growth.
  Past performance does not guarantee future returns.

  Q: What is a stop-loss?
  A: A stop-loss is an automatic sell order that triggers when a stock falls to a
  predetermined price to limit your loss. Example: Buy at ₹500, set stop-loss at ₹450.
  If stock falls to ₹450, it auto-sells. Limits maximum loss to 10%.

  Q: What is intraday trading?
  A: Buying and selling shares within the same trading day (9:15 AM – 3:30 PM).
  Profits are possible but risk is very high. STCG tax applies. Most intraday traders
  lose money. Not recommended for beginners.

  Q: What is the 52-week high/low?
  A: The highest and lowest price a stock traded at in the past 52 weeks. Stocks near
  52-week lows may be value opportunities — but always check WHY the stock fell before buying.

  Q: How do I read a company's quarterly result?
  A: Look for: Revenue growth (vs. last quarter + last year's same quarter), Net Profit,
  EBITDA margin, management commentary on outlook, any exceptional items.
  Compare with analyst estimates. Revenue beat + profit beat = positive. Miss = negative.

  Q: What is a bonus share or stock split?
  A: Bonus shares: Company gives free additional shares to existing shareholders.
  Example: 1:1 bonus = you get 1 extra share for every 1 you hold. Share count doubles,
  price halves, but total value stays the same.
  Stock split: Company divides each share into multiple. Purpose = improve liquidity.

  Q: What are blue-chip stocks?
  A: Large, well-established, financially sound companies with decades of stable performance.
  Examples: Reliance, TCS, HDFC Bank, Infosys, ITC. They pay regular dividends,
  have strong balance sheets, and are less volatile than mid/small caps.

  Q: How do I diversify my stock portfolio?
  A: Rule of thumb for beginners: Hold 15–20 stocks across 5–6 sectors. No single stock
  above 10% of portfolio. Balance with: large-caps (60%) + mid-caps (30%) + small-caps (10%).
  Or simply: Nifty 50 index fund (large) + Nifty Midcap 150 index fund (mid) = instant diversification.

  Q: What is SEBI and how does it protect me?
  A: SEBI (Securities Exchange Board of India) regulates all stock market participants —
  exchanges, brokers, mutual fund companies, listed companies. It sets rules to prevent
  fraud, insider trading, and market manipulation. File complaints at sebi.gov.in/sebiweb/other/OtherAction.do

  Q: What is the difference between NSE and BSE?
  A: Both are stock exchanges regulated by SEBI. NSE has higher trading volume and is
  more liquid. BSE is older (1875) and has more listed companies. For most investors,
  it doesn't matter — the same stocks are listed on both. NIFTY tracks NSE; SENSEX tracks BSE.

  Q: Can I invest in US stocks from India?
  A: Yes. Via platforms like INDmoney, Vested, Groww (international), or HDFC Securities
  international. The LRS (Liberalised Remittance Scheme) allows up to USD 2,50,000/year.
  Gains taxed as per Indian tax rules (20% LTCG after 2 years, slab rate for STCG).

