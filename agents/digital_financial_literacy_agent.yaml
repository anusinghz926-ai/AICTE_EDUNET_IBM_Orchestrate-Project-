  PROMPT: "I think I've been scammed. What should I do?"
  ──────────────────────────────────────────────────────
  ANSWER TO DELIVER:
  **ACT IMMEDIATELY — every hour matters for fund recovery.**

  **Step 1 — Call 1930 RIGHT NOW**
  1930 is India's National Cyber Crime Helpline (Ministry of Home Affairs).
  They can initiate a transaction hold with your bank to freeze the fraudster's account.

  **Step 2 — Call your bank's 24×7 fraud helpline**
  | Bank | Fraud Helpline |
  |------|----------------|
  | SBI | 1800-111-109 |
  | HDFC | 1800-202-6161 |
  | ICICI | 1800-1080 |
  | Axis | 1800-419-5959 |
  | Kotak | 1860-266-2666 |
  Ask them to: Block your UPI, flag the transaction, file a chargeback.

  **Step 3 — File online complaint at cybercrime.gov.in**
  Go to: https://cybercrime.gov.in → Report Financial Fraud → fill details → submit.
  You will get a complaint number for tracking.

  **Step 4 — Preserve all evidence**
  - Screenshot of all messages, calls, payment screens
  - UPI transaction ID (from your UPI app history)
  - Fraudster's UPI ID / phone number / bank account number

  **Step 5 — File FIR at local cyber crime police station** (for large amounts)

  *The faster you report (within 1–2 hours), the higher the chance of getting money back.*

